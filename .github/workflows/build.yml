name: Build & Push Flipitoimageserver (Production)

on:
  push:
    branches: [ "production" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/flipito

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build & Push User API
        run: |
          docker build \
            --build-arg GH_OWNER=Flipito \
            --build-arg GH_USER=${{ github.actor }} \
            --build-arg GH_PAT=${{ secrets.GHCR_READ_TOKEN }} \
            -f ./FlipitoImageServer/Dockerfile \
            -t ${{ env.IMAGE_NAMESPACE }}/flipitoimageapi:prod \
            -t ${{ env.IMAGE_NAMESPACE }}/flipitoimageapi:${{ github.sha }} \
            ./Flipitoimageserver
          docker push ${{ env.IMAGE_NAMESPACE }}/flipitoimageserver:prod
          docker push ${{ env.IMAGE_NAMESPACE }}/flipitoimageserver:${{ github.sha }}
